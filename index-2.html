<style>
  :root {
    --bg: #0B0B0C;
    --panel: #141415;
    --card: #1B1B1D;
    --card-hi: #232325;
    --red: #FF0000;
    --red-dim: #7A0000;
    --green: #1DD75B;
    --amber: #FFB020;
    --blue: #3B82F6;
    --txt: #F2F2F2;
    --txt-dim: #93939A;
    --line: #2A2A2D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    color: var(--txt);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .font-display { font-family: 'Archivo Black', sans-serif; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--red-dim); }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    transition: all .2s ease;
  }
  .card-clickable { cursor: pointer; transition: transform .12s ease, border-color .12s ease; }
  .card-clickable:active { transform: scale(0.98); }

  .pulse-dot { position: relative; }
  .pulse-dot::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 999px;
    border: 2px solid var(--red);
    animation: pulse 1.8s ease-out infinite;
  }
  .pulse-dot.green::after { border-color: var(--green); }
  @keyframes pulse {
    0% { transform: scale(.6); opacity: 1; }
    100% { transform: scale(1.8); opacity: 0; }
  }

  .score-ring { transform: rotate(-90deg); }
  .score-ring circle { transition: stroke-dashoffset 0.6s ease; }

  .badge { font-size: 10px; letter-spacing: .06em; padding: 2px 8px; border-radius: 999px; font-weight: 700; white-space: nowrap; }
  input, select { background: #0F0F10; border: 1px solid var(--line); color: var(--txt); border-radius: 10px; padding: 8px 12px; width: 100%; }
  input:focus, select:focus { outline: none; border-color: var(--red); }

  .scrollable { scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }

  .video-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
    z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-box {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px;
    max-width: 440px; width: 100%; max-height: 85vh; overflow-y: auto;
  }

  .notif-item {
    border-left: 3px solid var(--line); padding: 12px; margin-bottom: 8px; border-radius: 0 10px 10px 0;
    background: var(--card); transition: all .2s;
  }
  .notif-item.alert-breakout { border-left-color: var(--green); background: linear-gradient(90deg, rgba(29,215,91,0.08), transparent); }
  .notif-item.alert-late { border-left-color: var(--red); background: linear-gradient(90deg, rgba(255,0,0,0.08), transparent); }
  .notif-item.alert-stagnation { border-left-color: var(--amber); background: linear-gradient(90deg, rgba(255,176,32,0.08), transparent); }
  .notif-item.resolved { opacity: 0.5; border-left-color: var(--green); }
  .notif-item .resolve-btn {
    background: var(--green); color: #000; border: none; padding: 4px 12px; border-radius: 6px;
    font-size: 11px; font-weight: 600; cursor: pointer; transition: all .2s;
  }
  .notif-item .resolve-btn:hover { opacity: 0.8; }

  .loader-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; gap: 20px; }
  .curve-loader { width: 120px; height: 60px; position: relative; }
  .curve-loader svg { width: 100%; height: 100%; }
  .curve-loader .bg-line { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 3; }
  .curve-loader .progress-line {
    fill: none; stroke: var(--red); stroke-width: 3; stroke-linecap: round;
    stroke-dasharray: 200; stroke-dashoffset: 200; animation: curveFill 2s ease-in-out infinite;
  }
  @keyframes curveFill { 0% { stroke-dashoffset: 200; } 50% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -200; } }
  .curve-loader .pulse-circle { fill: var(--red); opacity: 0; animation: pulseCircle 2s ease-in-out infinite; }
  @keyframes pulseCircle { 0%, 100% { opacity: 0; transform: scale(0.5); } 50% { opacity: 1; transform: scale(1); } }
  .loader-text { color: var(--txt-dim); font-size: 14px; font-family: 'JetBrains Mono', monospace; letter-spacing: 1px; }
  .loader-text .dots::after { content: '...'; animation: dots 1.5s steps(4) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

  .fire-border {
    box-shadow: 0 0 15px rgba(255, 100, 0, 0.6), 0 0 30px rgba(255, 50, 0, 0.3), inset 0 0 15px rgba(255, 100, 0, 0.2);
    border-color: #FF5500 !important;
  }
  .focus-curve { border-top: 2px solid var(--amber); padding-top: 12px; margin-top: 12px; }
  .last-sync-badge { background: rgba(29, 215, 91, 0.1); color: var(--green); padding: 2px 10px; border-radius: 999px; font-size: 10px; border: 1px solid rgba(29, 215, 91, 0.2); }

  .artist-logo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--line); flex-shrink: 0; }
  .artist-detail-header { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 16px; }
  .artist-detail-header .back-btn { color: var(--txt-dim); }

  .variation-up { color: var(--green); }
  .variation-down { color: var(--red); }
  .variation-neutral { color: var(--txt-dim); }

  /* ==================== NEW MOBILE APP SHELL ==================== */
  .app-content { padding-bottom: 100px; min-height: calc(100vh - 90px); }

  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: rgba(20,20,21,0.97); backdrop-filter: blur(10px);
    border-top: 1px solid #1f1f1f;
    display: flex; align-items: stretch; justify-content: space-around;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .bottom-nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; padding: 9px 2px 8px; color: var(--txt-dim); font-size: 9.5px; font-weight: 600;
    background: none; border: none; cursor: pointer; transition: color .15s ease;
  }
  .bottom-nav-item i { font-size: 16px; }
  .bottom-nav-item.active { color: var(--red); }

  .sidebar { position: fixed; left: -290px; top: 0; bottom: 0; width: 290px; transition: left .3s ease; z-index: 50; }
  .sidebar.open { left: 0; }
  .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 45; display: none; }
  .sidebar-overlay.open { display: block; }

  .chip-tabs { display: flex; gap: 8px; }
  .chip-tab {
    padding: 7px 16px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
    background: var(--card); color: var(--txt-dim); border: 1px solid var(--line);
    cursor: pointer; transition: all .15s ease; white-space: nowrap;
  }
  .chip-tab.active { background: var(--red); color: #fff; border-color: var(--red); box-shadow: 0 4px 14px -4px rgba(255,0,0,.6); }

  /* Podium top 3 */
  .podium-wrap { display: flex; align-items: flex-end; justify-content: center; gap: 10px; margin-bottom: 22px; }
  .podium-card { flex: 1; max-width: 145px; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; cursor: pointer; }
  .podium-card.rank-1 { max-width: 168px; order: 2; padding-top: 26px; }
  .podium-card.rank-2 { order: 1; padding-top: 4px; }
  .podium-card.rank-3 { order: 3; padding-top: 4px; }
  .podium-rank-badge {
    width: 26px; height: 26px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
    font-family: 'Archivo Black', sans-serif; font-size: 12px; position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
    border: 2px solid var(--bg); z-index: 2;
  }
  .podium-crown { position: absolute; top: 0; left: 50%; transform: translateX(-50%) rotate(0deg); font-size: 20px; color: #FFD24C; z-index: 3; filter: drop-shadow(0 2px 6px rgba(255,180,0,.6)); }
  .podium-avatar-wrap { width: 100%; aspect-ratio: 1; border-radius: 16px; overflow: hidden; border: 2px solid var(--line); position: relative; background: #000; }
  .podium-card.rank-1 .podium-avatar-wrap { border-color: var(--red); box-shadow: 0 0 22px rgba(255,0,0,.4); }
  .podium-avatar-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .podium-score-wrap { width: 40px; height: 40px; margin-top: -20px; position: relative; z-index: 3; }
  .podium-card.rank-1 .podium-score-wrap { width: 46px; height: 46px; margin-top: -23px; }
  .podium-name { font-weight: 800; font-size: 13px; margin-top: 7px; max-width: 100%; }
  .podium-sub { font-size: 10.5px; color: var(--txt-dim); max-width: 100%; }
  .podium-delta { font-size: 11px; font-weight: 700; margin-top: 3px; font-family: 'JetBrains Mono', monospace; }

  /* Rank rows (podium 4-10, charts) */
  .rank-row { display: flex; align-items: center; gap: 12px; padding: 11px 10px; border-bottom: 1px solid var(--line); }
  .rank-row:last-child { border-bottom: none; }
  .rank-num { width: 16px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--txt-dim); flex-shrink: 0; }
  .rank-avatar { width: 42px; height: 42px; border-radius: 999px; object-fit: cover; flex-shrink: 0; border: 1px solid var(--line); background: #000; }
  .rank-name { font-weight: 800; font-size: 13.5px; }
  .rank-sub { font-size: 11px; color: var(--txt-dim); }
  .rank-score { font-family: 'Archivo Black', sans-serif; font-size: 15px; color: var(--txt); }
  .rank-delta { font-size: 11px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }

  /* Toggle switches */
  .toggle-switch { position: relative; width: 44px; height: 26px; flex-shrink: 0; display: inline-block; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .toggle-slider { position: absolute; inset: 0; background: #3a3a3d; border-radius: 999px; cursor: pointer; transition: .2s; }
  .toggle-slider::before { content: ''; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .toggle-switch input:checked + .toggle-slider { background: var(--red); }
  .toggle-switch input:checked + .toggle-slider::before { transform: translateX(18px); }

  /* Settings rows */
  .settings-section-title { font-size: 11px; letter-spacing: .08em; color: var(--txt-dim); text-transform: uppercase; font-weight: 700; margin: 22px 2px 8px; }
  .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 14px; }
  .settings-row + .settings-row { border-top: 1px solid var(--line); }
  .settings-label { font-size: 13.5px; font-weight: 600; }
  .settings-sub { font-size: 11px; color: var(--txt-dim); margin-top: 1px; }
  .settings-chevron { color: var(--txt-dim); font-size: 12px; }

  /* Figés grid */
  .figes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .figes-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px; position: relative; cursor: pointer; transition: border-color .15s; }
  .figes-card:active { transform: scale(.98); }
  .figes-thumb-wrap { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 4/3; background: #000; }
  .figes-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .figes-score-wrap { position: absolute; bottom: -16px; right: 8px; width: 38px; height: 38px; }
  .figes-lock { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 999px; background: rgba(0,0,0,.65); display: flex; align-items: center; justify-content: center; color: var(--red); font-size: 10px; }
  .figes-fire { position: absolute; top: 6px; left: 6px; color: #FF7A1A; font-size: 13px; filter: drop-shadow(0 0 4px rgba(255,100,0,.8)); }
  .figes-title { font-weight: 800; font-size: 12.5px; margin-top: 16px; }
  .figes-sub { font-size: 11px; color: var(--txt-dim); }
  .figes-footer { display: flex; align-items: center; gap: 6px; margin-top: 9px; }
  .figes-icon-btn { width: 30px; height: 30px; border-radius: 9px; background: #1a1a1a; display: flex; align-items: center; justify-content: center; color: var(--txt-dim); border: none; flex-shrink: 0; }
  .figes-more-btn { flex: 1; padding: 7px 0; border-radius: 9px; background: #1a1a1a; color: var(--txt); font-size: 11px; font-weight: 700; border: none; }

  /* FAB */
  .fab {
    position: fixed; right: 18px; bottom: 92px; width: 52px; height: 52px; border-radius: 999px;
    background: var(--red); color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 19px; box-shadow: 0 8px 24px rgba(255,0,0,.5); z-index: 35; border: none; cursor: pointer;
  }

  /* Analyse results */
  .result-row { display: flex; align-items: center; gap: 10px; padding: 11px 4px; border-bottom: 1px solid var(--line); }
  .result-row:last-child { border-bottom: none; }
  .result-thumb { width: 64px; height: 44px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); flex-shrink: 0; background: #000; }

  /* Field labels for Analyse form */
  .field-label { font-size: 11px; font-weight: 700; color: var(--txt-dim); display: block; margin-bottom: 6px; }
</style>

<script>

const YOUTUBE_API_KEY_CLIENT = "AIzaSyAs3o6uUU9QxkerS5HcSUzyrwSlcTKf-mI";
const COLORS = { red: "#FF0000", green: "#1DD75B", amber: "#FFB020", blue: "#3B82F6" };

// ========================================================================
// FIREBASE INIT
// ========================================================================
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();

// ========================================================================
// STATE
// ========================================================================
const state = {
  user: null,
  authLoading: false,
  trackedVideos: {},
  artists: [],
  activeTab: "podium",
  selectedVideoId: null,
  notifications: [],
  loading: false,
  loadingMsg: "",
  lastSync: null,
  notifPanelOpen: false,
  searchError: null,
  searchResults: [],
  charts: [],
  chartsLastSync: null,
  chartsMode: "top20",
  quickFilter: "",
  showModal: false,
  modalVideoId: null,
  drawerOpen: false,
  isLoadingShown: false,
  focusVideoId: null,
  focusInterval: 30,
  focusData: null,
  isInitialSync: true,
  syncInProgress: false,
  artistLogos: {},
  selectedArtist: null,
  podiumMode: "top10",
  artistesMode: "suivis",
  channelSearching: false,
  channelSearchResults: [],
  thresholdModalOpen: false,
  historyModalOpen: false,
  infoModalOpen: false,
};
let unsubscribeVideos = null;
let unsubscribeArtists = null;
let videosListenerFirstLoad = true;
let mainChartInstance = null;
let focusChartInstance = null;
let syncInterval = null;

// ========================================================================
// YOUTUBE API - API publique visible (recherches dynamiques)
// ========================================================================
const YT_BASE = "https://www.googleapis.com/youtube/v3";

async function ytFetch(endpoint, params) {
  const url = new URL(YT_BASE + "/" + endpoint);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  url.searchParams.set("key", YOUTUBE_API_KEY_CLIENT);
  const res = await fetch(url.toString());
  const data = await res.json();
  if (!res.ok) {
    const reason = data?.error?.errors?.[0]?.reason || data?.error?.message || "erreur inconnue";
    throw new Error(reason);
  }
  return data;
}

function parseISODuration(iso) {
  const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  if (!m) return 0;
  return (parseInt(m[1]||0) * 3600) + (parseInt(m[2]||0) * 60) + parseInt(m[3]||0);
}

// ========================================================================
// YOUTUBE API - Pour les appels autonomes (via GitHub Actions)
// La clé API utilisée est celle dans les secrets GitHub
// ========================================================================
async function getUploadsPlaylistId(channelId) {
  const data = await ytFetch("channels", { part: "contentDetails", id: channelId });
  if (!data.items?.length) throw new Error("Chaîne invalide");
  return data.items[0].contentDetails.relatedPlaylists.uploads;
}

async function getRecentUploadIds(playlistId, max = 20) {
  const data = await ytFetch("playlistItems", { part: "contentDetails", playlistId, maxResults: String(max) });
  return (data.items||[]).map(it => it.contentDetails.videoId);
}

async function getVideosDetails(ids) {
  if (!ids.length) return [];
  const out = [];
  for (let i = 0; i < ids.length; i += 50) {
    const chunk = ids.slice(i, i+50);
    const data = await ytFetch("videos", { part: "snippet,statistics,contentDetails", id: chunk.join(",") });
    out.push(...(data.items||[]));
  }
  return out;
}

async function getChannelInfo(channelId) {
  const data = await ytFetch("channels", { part: "snippet,statistics", id: channelId });
  if (!data.items?.length) return null;
  return {
    title: data.items[0].snippet.title,
    thumbnail: data.items[0].snippet.thumbnails?.default?.url,
    subscribers: parseInt(data.items[0].statistics.subscriberCount || 0),
  };
}

// ========================================================================
// FIRESTORE OPERATIONS
// ========================================================================
async function fsGetArtists() {
  try {
    const doc = await db.collection('meta').doc('artists').get();
    if (doc.exists) {
      const data = doc.data();
      return data.list || [];
    }
    return [];
  } catch (e) {
    console.error("Erreur fsGetArtists:", e);
    return [];
  }
}

async function fsAddArtist(artistName, channelId) {
  const ref = db.collection('meta').doc('artists');
  const doc = await ref.get();
  let list = [];
  if (doc.exists) {
    list = doc.data().list || [];
  }
  list.push({
    name: artistName,
    channelId: channelId,
    addedAt: new Date().toISOString()
  });
  await ref.set({ list: list }, { merge: true });
}

async function fsRemoveArtist(artistName) {
  const ref = db.collection('meta').doc('artists');
  const doc = await ref.get();
  if (doc.exists) {
    const list = (doc.data().list || []).filter(a => a.name !== artistName);
    await ref.set({ list: list }, { merge: true });
  }
}

async function fsUpsertVideo(video, artist) {
  const ref = db.collection('videos').doc(video.id);
  const nowIso = new Date().toISOString();
  const dateKey = nowIso.slice(0, 10);
  const potential = computeEngagementScore(video.likes, video.views);
  const snap = {
    t: nowIso,
    views: video.views,
    likes: video.likes,
    commentCount: video.commentCount || 0,
    potential
  };

  const doc = await ref.get();
  const prevRecent = doc.exists ? (doc.data().snapshotsRecent || []) : [];
  const recent = [...prevRecent.filter(s => s.t.slice(0, 10) !== dateKey), snap]
    .sort((a, b) => a.t.localeCompare(b.t))
    .slice(-10);

  const manualCategory = doc.exists ? (doc.data().manualCategory || null) : null;
  const userValidated = doc.exists ? (doc.data().userValidated || false) : false;

  await ref.set({
    title: video.title,
    artist: artist,
    channelId: video.channelId,
    channelTitle: video.channelTitle,
    thumbnail: video.thumbnail,
    publishedAt: video.publishedAt,
    duration: video.duration || 0,
    views: video.views,
    likes: video.likes,
    commentCount: video.commentCount || 0,
    snapshotsRecent: recent,
    lastUpdated: nowIso,
    frozen: doc.exists ? (doc.data().frozen || false) : false,
    frozenAt: doc.exists ? (doc.data().frozenAt || null) : null,
    manualCategory: manualCategory,
    userValidated: userValidated || false,
    deleted: doc.exists ? (doc.data().deleted || false) : false,
  }, { merge: true });

  await ref.collection('snapshots').doc(dateKey).set(snap, { merge: true });
}

async function fsFetchFullSnapshots(videoId) {
  try {
    const qs = await db.collection('videos').doc(videoId).collection('snapshots').orderBy('t', 'asc').get();
    return qs.docs.map(d => d.data());
  } catch (e) {
    return [];
  }
}

async function fsSetFrozen(videoId, frozen, date) {
  await db.collection('videos').doc(videoId).set({ frozen, frozenAt: date }, { merge: true });
}

async function fsSetManualCategory(videoId, category) {
  await db.collection('videos').doc(videoId).set({
    manualCategory: category,
    userValidated: true
  }, { merge: true });
}

async function fsDeleteVideo(videoId) {
  await db.collection('videos').doc(videoId).set({ deleted: true }, { merge: true });

// ========================================================================
// SCORING & CLASSIFICATION
// ========================================================================
function computeEngagementScore(likes, views) {
  if (!views) return 0;
  const ratio = (likes / views) * 100;
  return Math.max(0, Math.min(100, (ratio / 10) * 100));
}

function computeVelocityScore(snapshots) {
  if (!snapshots || snapshots.length < 2) return { score: null, viewsPerHour: 0 };
  const last = snapshots[snapshots.length-1];
  const prev = snapshots[snapshots.length-2];
  const dt = Math.max((new Date(last.t) - new Date(prev.t)) / 3600000, 0.1);
  const viewsPerHour = (last.views - prev.views) / dt;
  return {
    score: Math.max(0, Math.min(100, (viewsPerHour / 5000) * 100)),
    viewsPerHour
  };
}

function computeFinalScore(video) {
  const engagement = computeEngagementScore(video.likes, video.views);
  const velocity = computeVelocityScore(video.snapshotsRecent || []);
  const age = daysSince(video.publishedAt);
  const ageBonus = Math.max(0, Math.min(20, (30 - age) / 30 * 20));
  const freezeBonus = video.frozen ? 10 : 0;
  const total = engagement * 0.4 + (velocity.score ?? 50) * 0.3 + ageBonus * 0.3 + freezeBonus;
  return {
    total: Math.round(Math.min(100, total)),
    breakdown: {
      engagement: Math.round(engagement),
      velocity: velocity.score == null ? null : Math.round(velocity.score),
      ageBonus: Math.round(ageBonus),
      freezeBonus
    }
  };
}

function classify(video) {
  if (video.userValidated && video.manualCategory) {
    return video.manualCategory;
  }

  const engagement = computeEngagementScore(video.likes, video.views);
  const age = daysSince(video.publishedAt);
  const snaps = video.snapshotsRecent || [];

  const hasPeak = detectBreakout(snaps) || (snaps.length >= 3 &&
    snaps[snaps.length-1].views > snaps[snaps.length-2].views * 1.3);

  if (age <= 7 && engagement >= 50 && hasPeak) {
    return "petite";
  }

  if (age > 7 && age <= 30 && engagement >= 30 && hasPeak) {
    return "grande";
  }

  if (engagement >= 60 && hasPeak) {
    return "grande";
  }

  if (age <= 30 && engagement >= 20 && !hasPeak) {
    return "douteux";
  }

  return "hors-fenetre";
}

function daysSince(dateStr) {
  return (Date.now() - new Date(dateStr).getTime()) / 86400000;
}

function detectBreakout(snapshots) {
  if (!snapshots || snapshots.length < 3) return false;
  const v = snapshots.slice(-3).map(x => x.views);
  return v[1] - v[0] > 0 && (v[2] - v[1]) > (v[1] - v[0]) * 1.8;
}

function detectSlowdown(snapshots) {
  if (!snapshots || snapshots.length < 3) return false;
  const v = snapshots.slice(-3).map(x => x.views);
  return v[1] - v[0] > 0 && (v[2] - v[1]) < (v[1] - v[0]) * 0.4;
}

function detectStagnation(snapshots) {
  if (!snapshots || snapshots.length < 7) return false;
  const r = snapshots.slice(-7);
  const spread = Math.max(...r.map(x => x.views)) - Math.min(...r.map(x => x.views));
  const avg = r.reduce((a, x) => a + x.views, 0) / r.length;
  return (spread / avg) < 0.02;
}

function deriveVideo(v) {
  if (v.deleted) {
    return { ...v, category: "supprime", score: 0, deleted: true };
  }

  const snaps = v.snapshotsRecent || [];
  const category = classify(v);
  const scoreData = computeFinalScore(v);

  return {
    ...v,
    category,
    score: scoreData.total,
    breakdown: scoreData.breakdown,
    breakout: detectBreakout(snaps),
    slowdown: detectSlowdown(snaps),
    stagnation: category === "grande" && detectStagnation(snaps),
    comments: v.comments || null,
    fullSnapshots: v.fullSnapshots || null,
    needsValidation: category === "douteux" && !v.userValidated,
    focusEnabled: v.focusEnabled || false,
    focusInterval: v.focusInterval || 30,
  };
}

// ========================================================================
// PRÉDICTION — régression linéaire sur l'historique réel (fullSnapshots)
// ========================================================================
function linearRegression(xs, ys) {
  const n = xs.length;
  if (n < 2) return null;
  const meanX = xs.reduce((a, b) => a + b, 0) / n;
  const meanY = ys.reduce((a, b) => a + b, 0) / n;
  let num = 0, den = 0;
  for (let i = 0; i < n; i++) {
    num += (xs[i] - meanX) * (ys[i] - meanY);
    den += (xs[i] - meanX) ** 2;
  }
  if (den === 0) return null;
  const slope = num / den;
  const intercept = meanY - slope * meanX;
  let ssTot = 0, ssRes = 0;
  for (let i = 0; i < n; i++) {
    const pred = intercept + slope * xs[i];
    ssRes += (ys[i] - pred) ** 2;
    ssTot += (ys[i] - meanY) ** 2;
  }
  const rSquared = ssTot === 0 ? 1 : Math.max(0, Math.min(1, 1 - ssRes / ssTot));
  return { slope, intercept, rSquared };
}

function predictSeries(snapshots, horizonDays, valueSelector) {
  if (!snapshots || snapshots.length < 3 || horizonDays <= 0) return null;
  const t0 = new Date(snapshots[0].t).getTime();
  const dayMs = 86400000;
  const xs = snapshots.map(s => (new Date(s.t).getTime() - t0) / dayMs);
  const ys = snapshots.map(valueSelector);

  const reg = linearRegression(xs, ys);
  if (!reg) return null;

  const lastX = xs[xs.length - 1];
  const lastT = new Date(snapshots[snapshots.length - 1].t).getTime();
  const points = Array.from({ length: horizonDays }, (_, i) => {
    const dayOffset = i + 1;
    const x = lastX + dayOffset;
    return {
      t: new Date(lastT + dayOffset * dayMs).toISOString(),
      value: Math.max(0, reg.intercept + reg.slope * x),
    };
  });
  return { points, confidencePercent: Math.max(10, Math.min(95, reg.rSquared * 100)) };
}

// ========================================================================
function fsListenArtists() {
  if (unsubscribeArtists) unsubscribeArtists();
  unsubscribeArtists = db.collection('meta').doc('artists').onSnapshot(doc => {
    if (doc.exists) {
      const data = doc.data();
      state.artists = data.list || [];
      state.artists.forEach(a => {
        if (!state.artistLogos[a.channelId]) {
          getChannelInfo(a.channelId).then(info => {
            if (info) {
              state.artistLogos[a.channelId] = info.thumbnail;
              render();
            }
          }).catch(() => {});
        }
      });
    } else {
      state.artists = [];
    }
    render();
  }, err => {
    console.error("Erreur écoute artistes:", err);
  });
}

function fsListenVideos() {
  if (unsubscribeVideos) unsubscribeVideos();
  videosListenerFirstLoad = true;
  unsubscribeVideos = db.collection('videos').onSnapshot(qs => {
    const notifSettings = getNotifSettings();
    qs.docChanges().forEach(change => {
      const id = change.doc.id;
      if (change.type === 'removed') {
        delete state.trackedVideos[id];
        return;
      }
      const data = change.doc.data();
      const isNew = change.type === 'added' && !state.trackedVideos[id];
      const existing = state.trackedVideos[id] || {};
      state.trackedVideos[id] = deriveVideo({ ...existing, ...data, id });
      if (isNew && !videosListenerFirstLoad && notifSettings.nouveaux) {
        addNotification("info", `🆕 Nouveau morceau suivi : ${data.title} - ${data.artist}`, { videoId: id });
      }
    });
    videosListenerFirstLoad = false;
    evaluateNotifications();
    state.lastSync = new Date();
    render();
  }, err => {
    addNotification("error", "Erreur Firestore: " + err.message);
    render();
  });
}

// ========================================================================
// NOTIFICATIONS
// ========================================================================
function addNotification(type, msg, data = {}) {
  const id = Date.now() + Math.random();
  state.notifications.push({
    id, type, msg, data, resolved: false, createdAt: new Date().toISOString()
  });
  render();
}

function resolveNotification(id) {
  const notif = state.notifications.find(n => n.id === id);
  if (notif) { notif.resolved = true; render(); }
}

function clearResolvedNotifications() {
  state.notifications = state.notifications.filter(n => !n.resolved);
  render();
}

function evaluateNotifications() {
  const notifSettings = getNotifSettings();
  if (!notifSettings.alertes) return;
  Object.values(state.trackedVideos).forEach(v => {
    if (v.deleted || v.frozen) return;
    const hasNotif = state.notifications.some(n =>
      n.data.videoId === v.id && !n.resolved
    );
    if (v.breakout && !hasNotif) {
      addNotification("breakout", `🔥 ${v.title} - ${v.artist} en montée fracassante !`, { videoId: v.id });
    }
    if (v.slowdown && !hasNotif) {
      addNotification("late", `⚠️ ${v.title} - ${v.artist} ralentit`, { videoId: v.id });
    }
    if (v.stagnation && !hasNotif) {
      addNotification("stagnation", `📊 ${v.title} - ${v.artist} stagne depuis 7 jours`, { videoId: v.id });
    }
  });
}

// ========================================================================
// SYNC - Uniquement avec les artistes enregistrés
// ========================================================================
async function syncAll() {
  if (state.syncInProgress) return;

  if (state.artists.length === 0) {
    addNotification("info", "Aucun artiste suivi. Ajoute des chaînes d'abord !");
    render();
    return;
  }

  state.syncInProgress = true;
  state.loading = true;
  state.isLoadingShown = true;
  render();

  let totalVideos = 0;
  for (const artist of state.artists) {
    state.loadingMsg = `Collecte pour ${artist.name}...`;
    render();
    try {
      const playlistId = await getUploadsPlaylistId(artist.channelId);
      const ids = await getRecentUploadIds(playlistId, 20);
      const details = await getVideosDetails(ids);
      for (const v of details) {
        const video = {
          id: v.id,
          title: v.snippet.title,
          channelId: artist.channelId,
          channelTitle: v.snippet.channelTitle,
          thumbnail: v.snippet.thumbnails?.medium?.url || v.snippet.thumbnails?.default?.url,
          publishedAt: v.snippet.publishedAt,
          views: parseInt(v.statistics.viewCount || 0),
          likes: parseInt(v.statistics.likeCount || 0),
          commentCount: parseInt(v.statistics.commentCount || 0),
          duration: parseISODuration(v.contentDetails.duration)
        };
        await fsUpsertVideo(video, artist.name);
        totalVideos++;
      }
    } catch(e) {
      addNotification("error", `Erreur pour ${artist.name}: ${e.message}`);
    }
  }

  try {
    const frozenSnap = await db.collection('videos').where('frozen', '==', true).get();
    if (!frozenSnap.empty) {
      const frozenIds = frozenSnap.docs.map(d => d.id);
      const frozenData = {};
      frozenSnap.docs.forEach(d => frozenData[d.id] = d.data());
      const details = await getVideosDetails(frozenIds);
      for (const v of details) {
        const existing = frozenData[v.id];
        if (!existing) continue;
        const artistExists = state.artists.some(a => a.name === existing.artist);
        if (!artistExists) continue;
        const video = {
          id: v.id,
          title: v.snippet.title,
          channelId: existing.channelId,
          channelTitle: v.snippet.channelTitle,
          thumbnail: v.snippet.thumbnails?.medium?.url || v.snippet.thumbnails?.default?.url,
          publishedAt: v.snippet.publishedAt,
          views: parseInt(v.statistics.viewCount || 0),
          likes: parseInt(v.statistics.likeCount || 0),
          commentCount: parseInt(v.statistics.commentCount || 0),
          duration: parseISODuration(v.contentDetails.duration)
        };
        await fsUpsertVideo(video, existing.artist);
        totalVideos++;
      }
    }
  } catch(e) {
    addNotification("error", "Erreur mise à jour figés: " + e.message);
  }

  state.loading = false;
  state.isLoadingShown = false;
  state.loadingMsg = "";
  state.syncInProgress = false;
  state.isInitialSync = false;
  addNotification("info", `${totalVideos} vidéo(s) mises à jour.`);
  render();
}

async function addArtist() {
  const nameInput = document.getElementById('artist-name');
  const channelInput = document.getElementById('artist-channel');
  const name = nameInput?.value.trim();
  const channelId = channelInput?.value.trim();

  if (!name || !channelId) {
    addNotification("error", "Remplis le nom et l'ID de chaîne.");
    render();
    return;
  }

  if (state.artists.some(a => a.name.toLowerCase() === name.toLowerCase())) {
    addNotification("error", `"${name}" est déjà suivi.`);
    render();
    return;
  }

  try {
    const info = await getChannelInfo(channelId);
    if (!info) {
      addNotification("error", "ID de chaîne invalide.");
      render();
      return;
    }
    state.artistLogos[channelId] = info.thumbnail;
    await fsAddArtist(name, channelId);
    if (nameInput) nameInput.value = '';
    if (channelInput) channelInput.value = '';
    addNotification("info", `"${name}" ajouté avec succès ! (${info.title})`);
    setTimeout(() => syncAll(), 1000);
  } catch(e) {
    addNotification("error", "Erreur: " + e.message);
    render();
  }
}

async function followChannel(channelId, title) {
  if (state.artists.some(a => a.channelId === channelId)) return;

// ========================================================================
// API PUBLIQUE VISIBLE - Récupération des commentaires
// ========================================================================
async function getVideoComments(videoId, max = 12) {
  try {
    const data = await ytFetch("commentThreads", {
      part: "snippet", videoId, maxResults: String(max), order: "relevance", textFormat: "plainText"
    });
    return {
      items: (data.items||[]).map(it => {
        const c = it.snippet.topLevelComment.snippet;
        return {
          author: c.authorDisplayName, text: c.textDisplay, likeCount: c.likeCount,
          publishedAt: c.publishedAt, authorImg: c.authorProfileImageUrl
        };
      })
    };
  } catch(e) {
    return { error: "Commentaires non disponibles: " + e.message };
  }
}

// (comparé au fetch précédent, persisté en local)
// ========================================================================
function getChartsPrevRanks() {
  try { return JSON.parse(localStorage.getItem('ytp_charts_prev_ranks')) || {}; }
  catch(e) { return {}; }
}
function setChartsPrevRanks(map) { localStorage.setItem('ytp_charts_prev_ranks', JSON.stringify(map)); }

async function getTrendingMusicFR() {
  const all = [];
  let pageToken;
  let rank = 1;
  for (let page = 0; page < 2; page++) {
    const params = { part: "snippet,statistics,contentDetails", chart: "mostPopular", regionCode: "FR", videoCategoryId: "10", maxResults: "50" };
    if (pageToken) params.pageToken = pageToken;
    const data = await ytFetch("videos", params);
    (data.items||[]).forEach(v => {
      all.push({
        id: v.id,
        rank: rank++,
        title: v.snippet.title,
        channelTitle: v.snippet.channelTitle,
        channelId: v.snippet.channelId,
        thumbnail: v.snippet.thumbnails?.medium?.url,
        publishedAt: v.snippet.publishedAt,
        views: parseInt(v.statistics.viewCount||0),
        likes: parseInt(v.statistics.likeCount||0),
        commentCount: parseInt(v.statistics.commentCount||0),
        duration: parseISODuration(v.contentDetails.duration)
      });
    });
    pageToken = data.nextPageToken;
    if (!pageToken) break;
  }
  return all;
}

async function syncCharts() {
  state.loading = true;
  state.loadingMsg = "Chargement des charts YouTube FR...";
  state.isLoadingShown = true;
  render();
  try {
    const items = await getTrendingMusicFR();
    const prevRanks = getChartsPrevRanks();
    items.forEach(it => {
      it.score = Math.round(computeEngagementScore(it.likes, it.views));
      const prev = prevRanks[it.id];
      it.rankDelta = (prev != null) ? (prev - it.rank) : 0;
    });
    state.charts = items;
    state.chartsLastSync = new Date();
    const newRanks = {};
    items.forEach(it => newRanks[it.id] = it.rank);
    setChartsPrevRanks(newRanks);
  } catch(e) {
    addNotification("error", "Erreur Charts: " + e.message);
  }
  state.loading = false;
  state.isLoadingShown = false;
  state.loadingMsg = "";
  render();
}

function fmtNum(n) {
  if (n == null) return "—";
  const unit = getViewsUnit();
  if (unit === "brut") return n.toLocaleString('fr-FR');
  if (unit === "millions") {
    if (n >= 1e6) return (n/1e6).toLocaleString('fr-FR', { maximumFractionDigits: 1, minimumFractionDigits: n >= 1e7 ? 0 : 1 }) + "M";
    if (n >= 1e3) return (n/1e3).toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + "k";
    return String(n);
  }
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "k";
  return String(n);
}

function fmtViewsFr(n) {
  if (n == null) return "—";
  if (n >= 1e6) return (n/1e6).toLocaleString('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " M";
  if (n >= 1e3) return (n/1e3).toLocaleString('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " k";
  return n.toLocaleString('fr-FR');
}

function fmtAge(publishedAt) {
  const d = daysSince(publishedAt);
  if (d < 1) return Math.round(d * 24) + "h";
  if (d < 30) return Math.round(d) + "j";
  return Math.round(d / 30) + "mois";
}

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
}

function scoreColor(score) {
  if (score >= 70) return COLORS.green;
  if (score >= 40) return COLORS.amber;
  return COLORS.red;
}

function scoreRing(score, size = 56) {
  const r = (size - 8) / 2;
  const c = 2 * Math.PI * r;
  const offset = c - (score / 100) * c;
  return `<svg width="${size}" height="${size}" class="score-ring">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#2A2A2A" stroke-width="5" fill="none"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${scoreColor(score)}" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"/>
  </svg>`;
}

/* Ring toujours dans la teinte rouge/orange de la marque — utilisé pour
   les badges de score du Podium / Figés / Charts / résultats de recherche,
   pour correspondre visuellement à la maquette. */
function scoreRingBrand(score, size = 40) {
  const r = (size - 7) / 2;
  const c = 2 * Math.PI * r;
  const offset = c - (Math.max(0, Math.min(100, score)) / 100) * c;
  return `<svg width="${size}" height="${size}" class="score-ring">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#3a1414" stroke-width="4" fill="none"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${COLORS.red}" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"/>
  </svg>`;
}
function scoreBadgeBrand(score, size = 40, fontSize = 11) {
  return `<div class="relative" style="width:${size}px;height:${size}px;">${scoreRingBrand(score, size)}<span class="absolute inset-0 flex items-center justify-center font-display text-white" style="font-size:${fontSize}px;">${score}</span></div>`;
}

function sparkline(snapshots, key = 'views', w = 100, h = 28) {
  if (!snapshots || snapshots.length < 2) {
    return `<div class="text-[10px] text-[var(--txt-dim)]" style="height:${h}px">en mesure...</div>`;
  }
  const vals = snapshots.slice(-10).map(s => s[key] || 0);
  const min = Math.min(...vals);
  const max = Math.max(...vals);
  const range = (max - min) || 1;
  const pts = vals.map((v, i) => {
    const x = (i / (vals.length - 1)) * w;
    const y = h - ((v - min) / range) * h;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const color = vals[vals.length-1] >= vals[0] ? COLORS.green : COLORS.red;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function calculateVariation(data) {
  if (!data || data.length < 2) return 0;
  const first = data[0];
  const last = data[data.length - 1];
  if (first === 0) return 0;
  return ((last - first) / first) * 100;
}
function getVariationClass(variation) {
  if (variation > 0) return 'variation-up';
  if (variation < 0) return 'variation-down';
  return 'variation-neutral';
}
function formatVariation(variation) {
  if (variation === 0) return '±0%';
  const sign = variation > 0 ? '+' : '';
  return `${sign}${variation.toFixed(1)}%`;
}

function scoreDelta(v) {
  const snaps = v.snapshotsRecent || [];
  if (snaps.length < 2) return 0;
  const last = snaps[snaps.length-1], prev = snaps[snaps.length-2];
  const engLast = computeEngagementScore(last.likes, last.views);
  const engPrev = computeEngagementScore(prev.likes, prev.views);
  return Math.round(engLast - engPrev);
}
function deltaClass(d) { return d > 0 ? 'variation-up' : d < 0 ? 'variation-down' : 'variation-neutral'; }
function deltaLabel(d) { return d === 0 ? '=' : (d > 0 ? '+' : '') + d; }

// ========================================================================
// PODIUM - Uniquement avec les artistes enregistrés
// ========================================================================
function getPodium(mode = 'top10') {
  const artistNames = new Set(state.artists.map(a => a.name));
  let list = Object.values(state.trackedVideos)
    .filter(v =>
      !v.deleted &&
      v.category !== "supprime" &&
      artistNames.has(v.artist) &&
      (!state.quickFilter || v.artist.toLowerCase().includes(state.quickFilter.toLowerCase()))
    );
  if (mode === 'tendance') {
    list = list.filter(v => v.breakout || (v.breakdown.velocity ?? 0) > 0)
      .sort((a, b) => (b.breakdown.velocity ?? 0) - (a.breakdown.velocity ?? 0));
  } else {
    list = list.sort((a, b) => b.score - a.score);
  }
  return list.slice(0, 10);
}

function getVideosForTab(category) {
  const artistNames = new Set(state.artists.map(a => a.name));
  return Object.values(state.trackedVideos)
    .filter(v =>
      v.category === category &&
      !v.deleted &&
      artistNames.has(v.artist) &&
      (!state.quickFilter || v.artist.toLowerCase().includes(state.quickFilter.toLowerCase()))
    )
    .sort((a, b) => b.score - a.score);
}

function isRecent(video) {
  return daysSince(video.publishedAt) <= getRecentThresholdDays();
}

          <button class="px-3 py-2 rounded-lg bg-[#1a1a1a] hover:bg-[#2a2a2a] text-white text-sm" onclick="setFocusInterval(120)">120 min</button>
        </div>
        <div class="flex gap-2 mt-4">
          <button class="flex-1 px-4 py-2 rounded-lg bg-red-600/30 text-red-300 hover:bg-red-600 text-sm" onclick="clearFocus(); state.showModal=false; state.modalVideoId=null; render();">Désactiver</button>
          <button class="flex-1 px-4 py-2 rounded-lg bg-[#1a1a1a] hover:bg-[#2a2a2a] text-white text-sm" onclick="state.showModal=false; state.modalVideoId=null; render();">Annuler</button>
        </div>

  }

  return `
  <div class="modal-overlay" onclick="if(event.target===this) { state.showModal=false; state.modalVideoId=null; render(); }">
    <div class="modal-box">
      <h3 class="font-display text-sm mb-2">❓ Classification</h3>
      <p class="text-sm font-semibold">${v.title}</p>
      <p class="text-xs text-[var(--txt-dim)] mb-2">${v.artist}</p>
      <p class="text-xs text-[var(--txt-dim)]">Engagement: ${v.breakdown.engagement}% · Âge: ${fmtAge(v.publishedAt)}</p>
      <p class="text-xs text-[var(--txt-dim)] mt-2 mb-1">Choisis la catégorie :</p>
      <div class="flex flex-wrap gap-2 mt-2">
        <button class="flex-1 min-w-[80px] px-4 py-2 rounded-lg bg-red-600 hover:bg-red-500 text-white text-sm" onclick="setVideoCategory('grande')">✅ Grande</button>
        <button class="flex-1 min-w-[80px] px-4 py-2 rounded-lg bg-[#1a1a1a] hover:bg-[#2a2a2a] text-white text-sm" onclick="setVideoCategory('petite')">📈 Petite</button>
        <button class="flex-1 min-w-[80px] px-4 py-2 rounded-lg bg-[#1a1a1a] hover:bg-[#2a2a2a] text-white text-sm" onclick="setVideoCategory('hors-fenetre')">⏭️ Hors</button>
        <button class="flex-1 min-w-[80px] px-4 py-2 rounded-lg bg-[#1a1a1a] hover:bg-[#2a2a2a] text-white text-sm" onclick="state.showModal=false; state.modalVideoId=null; render();">❌ Annuler</button>
      </div>
    </div>
  </div>`;
}

function renderThresholdModal() {
  const threshold = getRecentThresholdDays();
  const horizon = getPredictionHorizonDays();
  return `
  <div class="modal-overlay" onclick="if(event.target===this) closeThresholdModal()">
    <div class="modal-box">
      <h3 class="font-display text-sm mb-1">Seuil "récent" <i class="fa-solid fa-fire text-orange-400 ml-1"></i></h3>
      <p class="text-xs text-[var(--txt-dim)] mb-3">Contour appliqué aux morceaux publiés il y a moins de X jours.</p>
      <div class="flex items-center gap-3 mb-5">
        <input id="threshold-range" type="range" min="1" max="30" value="${threshold}" class="flex-1" oninput="document.getElementById('threshold-label').textContent = this.value + ' j'" onchange="setRecentThresholdDays(Number(this.value)); render()" />
        <span id="threshold-label" class="font-mono text-sm w-10 text-right">${threshold} j</span>
      </div>
      <h3 class="font-display text-sm mb-1">Horizon de prédiction</h3>
      <p class="text-xs text-[var(--txt-dim)] mb-3">Jours projetés (pointillés) sur le graphique d'Analyse.</p>
      <div class="flex gap-2 mb-5">
        ${[3,7,15,30].map(d => `<button onclick="setPredictionHorizonDays(${d}); render()" class="px-3 py-2 rounded-lg text-sm font-semibold transition ${horizon===d?'bg-red-600 text-white':'bg-[#1a1a1a] hover:bg-[#242424] text-[var(--txt-dim)]'}">${d}j</button>`).join('')}
      </div>
      <button onclick="closeThresholdModal()" class="w-full py-2.5 rounded-lg bg-[#1a1a1a] hover:bg-[#242424] text-white text-sm font-semibold">Fermer</button>
