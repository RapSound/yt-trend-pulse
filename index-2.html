  </div>`;
}

function renderHistoryModal() {
  const activeVideos = Object.values(state.trackedVideos).filter(v => !v.deleted);
  const frozenCount = activeVideos.filter(v => v.frozen).length;
  return `
  <div class="modal-overlay" onclick="if(event.target===this) closeHistoryModal()">
    <div class="modal-box">
      <h3 class="font-display text-sm mb-3">Santé du suivi</h3>
      <div class="grid grid-cols-2 gap-3 text-sm mb-4">
        <div><p class="text-[var(--txt-dim)] text-xs">Artistes suivis</p><p class="font-mono text-lg">${state.artists.length}</p></div>
        <div><p class="text-[var(--txt-dim)] text-xs">Morceaux suivis</p><p class="font-mono text-lg">${activeVideos.length}</p></div>
        <div><p class="text-[var(--txt-dim)] text-xs">Morceaux figés</p><p class="font-mono text-lg">${frozenCount}</p></div>
        <div><p class="text-[var(--txt-dim)] text-xs">Dernière synchro</p><p class="font-mono text-sm">${state.lastSync ? state.lastSync.toLocaleString('fr-FR') : 'jamais'}</p></div>
      </div>
      <p class="text-xs text-[var(--txt-dim)] mb-4">Toutes les données sont conservées côté Firestore, sans purge automatique — la synchro planifiée à 00:00 UTC tourne via GitHub Actions, indépendamment de cet appareil.</p>
      <button onclick="closeHistoryModal()" class="w-full py-2.5 rounded-lg bg-[#1a1a1a] hover:bg-[#242424] text-white text-sm font-semibold">Fermer</button>
    </div>
  </div>`;
}

function renderInfoModal() {
  return `
  <div class="modal-overlay" onclick="if(event.target===this) closeInfoModal()">
    <div class="modal-box">
      <h3 class="font-display text-sm mb-2">Comment le score est calculé</h3>
      <p class="text-xs text-[var(--txt-dim)] leading-relaxed mb-3">Le score (0-100) combine l'engagement (likes/vues), la vélocité récente (vues/heure), un bonus de fraîcheur selon l'âge du morceau, et un bonus si le morceau est figé. "En tendance" trie plutôt par vélocité pure.</p>
      <button onclick="closeInfoModal()" class="w-full py-2.5 rounded-lg bg-red-600 hover:bg-red-500 text-white text-sm font-semibold">Compris</button>
    </div>
  </div>`;
}

// ========================================================================
// RENDER ACTIVE TAB
// ========================================================================
function renderActiveTab() {
  switch(state.activeTab) {
    case "podium": return renderPodium();
    case "figes": return renderFiges();
    case "analyse": return renderAnalyse();
    case "charts": return renderCharts();
    case "artistes": return renderArtistes();
    case "parametres": return renderParametres();
    default: return renderPodium();
  }
}

// ========================================================================
// PODIUM
// ========================================================================
function renderPodium() {
  const mode = state.podiumMode || 'top10';
  const header = `
  <div class="flex items-center justify-between mb-4">
    <div class="chip-tabs">
      <button class="chip-tab ${mode==='top10'?'active':''}" onclick="setPodiumMode('top10')">Top 10</button>
      <button class="chip-tab ${mode==='tendance'?'active':''}" onclick="setPodiumMode('tendance')">En tendance</button>
    </div>
    <button onclick="openInfoModal()" class="w-7 h-7 rounded-full flex items-center justify-center text-[var(--txt-dim)]"><i class="fa-solid fa-circle-info"></i></button>
  </div>`;

  const pool = getPodium(mode);
  if (!pool.length) {
    return header + `<div class="flex flex-col items-center justify-center py-16 text-[var(--txt-dim)]">
      <i class="fa-solid fa-trophy text-3xl mb-3 opacity-40"></i>
      <p class="text-sm text-center max-w-xs">Pas assez de données. Ajoute des artistes et lance une collecte.</p>
    </div>`;
  }

  const top3 = pool.slice(0, 3);
  const rest = pool.slice(3, 10);

  return header + podiumTop3(top3) + (rest.length ? `<div class="card px-2">${rest.map((v,i) => rankRow(v, i+4)).join('')}</div>` : '');
}

function podiumTop3(top3) {
  if (!top3.length) return '';
  const order = [1, 0, 2].filter(i => top3[i]);
  const badgeColors = { 2: '#C9CDD3', 3: '#C9812F' };
  return `<div class="podium-wrap">
    ${order.map(i => {
      const v = top3[i];
      const rank = i + 1;
      const delta = scoreDelta(v);
      return `
      <div class="podium-card rank-${rank}" onclick="openAnalyse('${v.id}')">
        ${rank === 1
          ? `<i class="fa-solid fa-crown podium-crown"></i>`
          : `<div class="podium-rank-badge" style="background:${badgeColors[rank]};color:#141414;">${rank}</div>`}
        <div class="podium-avatar-wrap"><img src="${v.thumbnail}" alt="${v.artist}"/></div>
        <div class="podium-score-wrap">${scoreBadgeBrand(v.score, rank===1?46:40, rank===1?12:11)}</div>
        <p class="podium-name truncate w-full">${v.artist}</p>
        <p class="podium-sub truncate w-full">${v.title}</p>
        <p class="podium-delta ${deltaClass(delta)}">${deltaLabel(delta)}</p>
      </div>`;
    }).join('')}
  </div>`;
}

function rankRow(v, rank, opts = {}) {
  const delta = opts.delta !== undefined ? opts.delta : scoreDelta(v);
  const recent = isRecent(v);
  return `
  <div class="rank-row cursor-pointer" onclick="openAnalyse('${v.id}')">
    <span class="rank-num">${rank}</span>
    <img src="${v.thumbnail}" class="rank-avatar" alt="${v.artist}"/>
    <div class="flex-1 min-w-0">
      <p class="rank-name truncate">${v.artist}</p>
      <p class="rank-sub truncate">${v.title}</p>
    </div>
    <div class="flex flex-col items-end gap-0.5">
      <span class="rank-score">${v.score}</span>
      <span class="rank-delta ${deltaClass(delta)} flex items-center gap-1">${deltaLabel(delta)}${recent ? ' <i class="fa-solid fa-fire text-orange-400"></i>' : ''}</span>
    </div>
  </div>`;
}

// ========================================================================
// FIGÉS
// ========================================================================
function renderFiges() {
  const artistNames = new Set(state.artists.map(a => a.name));
  const frozen = Object.values(state.trackedVideos)
    .filter(v => v.frozen && !v.deleted && artistNames.has(v.artist) &&
      (!state.quickFilter || v.artist.toLowerCase().includes(state.quickFilter.toLowerCase())))
    .sort((a, b) => b.score - a.score);

  if (!frozen.length) {
    return `<div class="flex flex-col items-center justify-center py-16 text-[var(--txt-dim)]">
      <i class="fa-solid fa-lock text-3xl mb-3 opacity-40"></i>
      <p class="text-sm text-center max-w-xs">Aucun morceau figé. Utilise le cadenas sur un morceau (dans Analyse) pour le suivre en priorité.</p>
    </div>`;
  }

  return `<div class="figes-grid">${frozen.map(v => figesCard(v)).join('')}</div>`;
}

function figesCard(v) {
  const recent = isRecent(v);
  return `
  <div class="figes-card" onclick="openAnalyse('${v.id}')">
    <div class="figes-thumb-wrap">
      <img src="${v.thumbnail}" alt="${v.title}"/>
      ${recent ? `<i class="fa-solid fa-fire figes-fire"></i>` : ''}
      <div class="figes-lock"><i class="fa-solid fa-lock"></i></div>
      <div class="figes-score-wrap">${scoreBadgeBrand(v.score, 38, 10)}</div>
    </div>
    <p class="figes-title truncate">${v.artist}</p>
    <p class="figes-sub truncate">${v.title}</p>
    <div class="figes-footer">
      <button class="figes-icon-btn" onclick="event.stopPropagation(); openAnalyse('${v.id}')"><i class="fa-solid fa-chart-line text-xs"></i></button>
      <button class="figes-more-btn" onclick="event.stopPropagation(); openAnalyse('${v.id}')">Voir plus</button>
    </div>
  </div>`;
}

// ========================================================================
// ARTISTES
// ========================================================================
function renderArtistes() {
  if (state.selectedArtist) return renderArtistDetail(state.selectedArtist);
  const mode = state.artistesMode || 'suivis';
  const header = `
  <div class="chip-tabs mb-4">
    <button class="chip-tab ${mode==='suivis'?'active':''}" onclick="setArtistesMode('suivis')">Suivis (${state.artists.length})</button>
    <button class="chip-tab ${mode==='decouvrir'?'active':''}" onclick="setArtistesMode('decouvrir')">Découvrir</button>
  </div>`;
  return header + (mode === 'decouvrir' ? renderArtistDiscover() : renderArtistList());
}

function renderArtistList() {
  const filtered = state.quickFilter
    ? state.artists.filter(a => a.name.toLowerCase().includes(state.quickFilter.toLowerCase()))
    : state.artists;
  if (!state.artists.length) {
    return `<div class="flex flex-col items-center justify-center py-12 text-[var(--txt-dim)]"><i class="fa-solid fa-users text-2xl mb-3 opacity-40"></i><p class="text-sm text-center">Aucun artiste suivi.<br/>Va dans "Découvrir" pour en ajouter.</p></div>`;
  }
  if (!filtered.length) {
    return `<div class="flex flex-col items-center justify-center py-12 text-[var(--txt-dim)]"><i class="fa-solid fa-filter text-2xl mb-3 opacity-40"></i><p class="text-sm">Aucun artiste ne correspond au filtre.</p></div>`;
  }
  return `<div class="card px-2">${filtered.map(a => artistRow(a)).join('')}</div>`;
}

function artistRow(a) {
  const videos = Object.values(state.trackedVideos).filter(v => v.artist === a.name && !v.deleted);
  const avgScore = videos.length ? Math.round(videos.reduce((s,v)=>s+v.score,0)/videos.length) : 0;
  const logoUrl = state.artistLogos[a.channelId] || `https://ui-avatars.com/api/?name=${encodeURIComponent(a.name)}&background=FF0000&color=fff&size=128`;
  const trend = artistTrendInfo(a.name);
  return `
  <div class="rank-row cursor-pointer" onclick="selectArtist('${a.name}')">
    <img src="${logoUrl}" class="rank-avatar" alt="${a.name}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(a.name)}&background=FF0000&color=fff&size=128'"/>
    <div class="flex-1 min-w-0">
      <p class="rank-name truncate">${a.name}</p>
      <p class="rank-sub truncate">${videos.length} morceau${videos.length>1?'x':''} suivi${videos.length>1?'s':''}</p>
    </div>
    <div class="flex flex-col items-end gap-0.5 mr-1">
      <span class="text-[9px] text-[var(--txt-dim)]">Score moyen</span>
      <div class="flex items-center gap-1.5">
        <span class="rank-score ${deltaClass(trend.rising ? 1 : -1)}" style="font-size:14px;">${avgScore}</span>
        ${sparkline(trend.snaps, 'views', 44, 20)}
      </div>
    </div>
    <i class="fa-solid fa-chevron-right text-[var(--txt-dim)] text-xs"></i>
  </div>`;
}

function artistTrendInfo(name) {
  const byDate = {};
  Object.values(state.trackedVideos).filter(v => v.artist === name && !v.deleted).forEach(v => {
    (v.snapshotsRecent||[]).forEach(s => {
      const d = s.t.slice(0,10);
      byDate[d] = (byDate[d]||0) + (s.views||0);
    });
  });
  const dates = Object.keys(byDate).sort();
  const snaps = dates.map(d => ({ t: d, views: byDate[d] }));
  const rising = snaps.length >= 2 ? snaps[snaps.length-1].views >= snaps[0].views : true;
  return { snaps, rising };
}

function renderArtistDiscover() {
  return `
  <div class="card p-4 mb-4">
    <p class="text-xs text-[var(--txt-dim)] mb-3">Cherche une chaîne YouTube à suivre.</p>
    <div class="flex gap-2">
      <input id="channel-search-input" type="text" placeholder="Nom d'artiste (ex : JUL)" class="flex-1 text-sm" onkeydown="if(event.key==='Enter') searchChannels()" />
      <button onclick="searchChannels()" class="px-4 rounded-lg bg-red-600 hover:bg-red-500 text-white text-sm font-semibold"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
    <p class="text-[10px] text-[var(--txt-dim)] mt-3 mb-1.5">Ou ajoute directement un ID de chaîne :</p>
    <div class="flex gap-2 flex-wrap">
      <input id="artist-name" type="text" placeholder="Nom" class="flex-1 min-w-[100px] text-xs py-2" />
      <input id="artist-channel" type="text" placeholder="ID de chaîne (UC...)" class="flex-1 min-w-[130px] text-xs py-2" />
      <button onclick="addArtist()" class="px-3 py-2 rounded-lg bg-[#1a1a1a] hover:bg-[#242424] text-xs font-semibold">Ajouter</button>
    </div>
  </div>
  ${state.channelSearching ? `<div class="flex items-center justify-center py-6 text-[var(--txt-dim)] text-xs"><i class="fa-solid fa-spinner animate-spin mr-2"></i>Recherche...</div>` : ''}
  ${state.channelSearchResults && state.channelSearchResults.length ? `<div class="card px-2">${state.channelSearchResults.map(c => channelResultRow(c)).join('')}</div>` : ''}
  `;
}

function channelResultRow(c) {
  const already = state.artists.some(a => a.channelId === c.channelId);
  const safeTitle = (c.title||'').replace(/'/g, "\\'").replace(/"/g, '&quot;');
  return `
  <div class="rank-row">
    <img src="${c.thumbnail}" class="rank-avatar" alt="${c.title}"/>
    <div class="flex-1 min-w-0">
      <p class="rank-name truncate">${c.title}</p>
      <p class="rank-sub truncate">${c.description || 'Chaîne YouTube'}</p>
    </div>
    <button onclick="followChannel('${c.channelId}','${safeTitle}')" class="text-[11px] px-3 py-1.5 rounded-lg font-semibold shrink-0 ${already ? 'bg-[#1a1a1a] text-[var(--txt-dim)]' : 'bg-red-600 text-white hover:bg-red-500'}" ${already?'disabled':''}>${already?'Suivi':'Suivre'}</button>
  </div>`;
}

// ========================================================================
// ARTIST DETAIL
// ========================================================================
function renderArtistDetail(artistName) {
  const videos = Object.values(state.trackedVideos)
    .filter(v => v.artist === artistName && !v.deleted)
    .sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt));

  const artistInfo = state.artists.find(a => a.name === artistName);
  const logoUrl = artistInfo ? (state.artistLogos[artistInfo.channelId] || `https://ui-avatars.com/api/?name=${encodeURIComponent(artistName)}&background=FF0000&color=fff&size=128`) : '';

  return `
  <div class="artist-detail-header">
    <button class="back-btn" onclick="selectArtist(null)"><i class="fa-solid fa-arrow-left text-xl"></i></button>
    <img src="${logoUrl}" class="artist-logo" style="width:56px;height:56px;" alt="${artistName}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(artistName)}&background=FF0000&color=fff&size=128'" />
    <div class="min-w-0">
      <h2 class="text-lg font-display truncate">${artistName}</h2>
      <p class="text-xs text-[var(--txt-dim)]">${videos.length} son(s) · ${videos.filter(v => isRecent(v)).length} récent(s)</p>
    </div>
  </div>
  ${videos.length ? `<div class="video-grid">${videos.map(v => videoCard(v, true)).join("")}</div>` : `
    <div class="flex flex-col items-center justify-center py-12 text-[var(--txt-dim)]">
      <i class="fa-solid fa-music text-3xl mb-3 opacity-40"></i>
      <p class="text-sm">Aucun son trouvé pour ${artistName}.</p>
    </div>`}`;
}

function videoCard(v, showDelete = true) {
  const recent = isRecent(v);
  const fireClass = recent ? ' fire-border' : '';
  const catBadge = v.category === "grande"
    ? `<span class="badge bg-red-900/40 text-red-300 border border-red-800">GRANDE</span>`
    : v.category === "petite"
    ? `<span class="badge bg-blue-900/40 text-blue-300 border border-blue-800">PETITE</span>`
    : v.category === "douteux"
    ? `<span class="badge bg-amber-900/40 text-amber-300 border border-amber-800">⚠️ DOUTEUX</span>`
    : `<span class="badge bg-gray-800 text-gray-400 border border-gray-700">NON CLASSÉ</span>`;

  return `
  <div class="card p-3 flex flex-col gap-2 relative ${fireClass}">
    ${v.breakout ? `<div class="absolute top-2 right-2 pulse-dot w-2 h-2 rounded-full bg-green-400"></div>` : ""}
    ${v.frozen ? `<div class="absolute top-2 right-2 text-red-500"><i class="fa-solid fa-lock text-xs"></i></div>` : ""}
    ${recent ? `<div class="absolute top-2 left-2 text-orange-400 text-xs"><i class="fa-solid fa-fire"></i></div>` : ""}

    <div class="flex gap-3 cursor-pointer" onclick="openAnalyse('${v.id}')">
      <img src="${v.thumbnail}" class="w-24 h-16 object-cover rounded-lg border border-[#2a2a2a] flex-shrink-0" />
      <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold truncate" title="${v.title}">${v.title}</p>
        <p class="text-xs text-[var(--txt-dim)] font-mono">${v.artist} · ${fmtAge(v.publishedAt)}</p>
        <div class="mt-1 flex flex-wrap gap-1">${catBadge}</div>
      </div>
      <div class="flex flex-col items-center justify-center relative shrink-0">${scoreRing(v.score, 44)}<span class="absolute font-display text-xs" style="color:${scoreColor(v.score)}">${v.score}</span></div>
    </div>

    <div class="border-t border-[#2a2a2a] pt-2">${sparkline(v.snapshotsRecent)}</div>

    <div class="flex items-center justify-between gap-2 text-xs flex-wrap">
      <div class="flex gap-2 text-[var(--txt-dim)] font-mono">
        <span>${fmtNum(v.views)} vues</span>
        <span>${v.breakdown.engagement}% eng.</span>
      </div>
      <div class="flex gap-1 flex-wrap">
        <button onclick="event.stopPropagation(); openPlayer('${v.id}')" class="px-2 py-1 rounded-lg text-[10px] font-semibold transition bg-red-600/30 text-red-300 hover:bg-red-600"><i class="fa-solid fa-play"></i></button>
        <button onclick="event.stopPropagation(); toggleFreeze('${v.id}')" class="px-2 py-1 rounded-lg text-[10px] font-semibold transition ${v.frozen ? 'bg-red-900/50 text-red-300 cursor-default' : 'bg-[#262626] text-[var(--txt-dim)] hover:text-white hover:bg-red-600'}">
          <i class="fa-solid ${v.frozen ? 'fa-lock' : 'fa-lock-open'}"></i>
        </button>
        ${showDelete ? `<button onclick="event.stopPropagation(); deleteVideo('${v.id}')" class="px-2 py-1 rounded-lg text-[10px] font-semibold transition text-[var(--txt-dim)] hover:text-red-500"><i class="fa-solid fa-trash"></i></button>` : ""}
      </div>
    </div>
  </div>`;
}

// ========================================================================
// ANALYSE
// ========================================================================
function renderAnalyse() {
  const v = state.selectedVideoId ? state.trackedVideos[state.selectedVideoId] : null;
  return `
  <div class="card p-4 mb-4">
    <label class="field-label">Artiste (facultatif)</label>
    <input id="search-artist" type="text" placeholder="Ex : Ninho" class="text-sm mb-3" onkeydown="if(event.key==='Enter') runManualSearch()" />
    <label class="field-label">Titre (obligatoire)</label>
    <input id="search-title" type="text" placeholder="Ex : Jefe" class="text-sm mb-3" onkeydown="if(event.key==='Enter') runManualSearch()" />
    <button onclick="runManualSearch()" class="w-full py-2.5 rounded-lg bg-red-600 hover:bg-red-500 text-white text-sm font-semibold transition flex items-center justify-center gap-2">
      <i class="fa-solid fa-magnifying-glass"></i> Rechercher
    </button>
    ${state.searchError ? `<p class="text-xs text-red-400 mt-2">${state.searchError}</p>` : ''}
  </div>
  ${state.searchResults && state.searchResults.length ? `
  <div class="mb-4">
    <p class="settings-section-title !mt-0 !mb-1">Résultats</p>
    <div class="card px-3">${state.searchResults.map(r => searchResultRow(r)).join('')}</div>
  </div>` : ''}
  ${v ? renderAnalyseDetail(v) : (!(state.searchResults||[]).length ? `<div class="flex flex-col items-center justify-center py-12 text-[var(--txt-dim)]"><i class="fa-solid fa-magnifying-glass-chart text-3xl mb-3 opacity-40"></i><p class="text-sm text-center">Cherche un morceau ou clique un résultat pour l'analyser.</p></div>` : '')}`;
}

function searchResultRow(r) {
  return `
  <div class="result-row">
    <img src="${r.thumbnail}" class="result-thumb" alt="${r.title}"/>
    <div class="flex-1 min-w-0">
      <p class="text-[13px] font-semibold truncate">${r.title}</p>
      <p class="text-[10.5px] text-[var(--txt-dim)] mt-0.5">${fmtDate(r.publishedAt)}</p>
      <p class="text-[10.5px] text-[var(--txt-dim)]"><i class="fa-solid fa-eye mr-1"></i>${fmtViewsFr(r.views)} vues</p>
    </div>
    <div class="flex flex-col items-center gap-1.5 shrink-0">
      ${scoreBadgeBrand(r.quickScore, 36, 10)}
      <button onclick="selectSearchResult('${r.id}')" class="text-[10px] px-2.5 py-1 rounded-md bg-[#1a1a1a] hover:bg-red-600 hover:text-white font-semibold transition">Analyser</button>
    </div>
  </div>`;
}

function renderAnalyseDetail(v) {
  const recent = isRecent(v);
  const fireClass = recent ? ' fire-border' : '';
  const hasFocus = v.focusEnabled || state.focusVideoId === v.id;

  const fullSnapshots = v.fullSnapshots || [];
  const viewsVariation = fullSnapshots.length >= 2 ? calculateVariation(fullSnapshots.map(s => s.views)) : 0;
  const likesVariation = fullSnapshots.length >= 2 ? calculateVariation(fullSnapshots.map(s => s.likes)) : 0;
  const commentsVariation = fullSnapshots.length >= 2 ? calculateVariation(fullSnapshots.map(s => s.commentCount || 0)) : 0;

  return `
  <div class="card p-4 mb-4 ${fireClass}">
    <div class="flex gap-4 items-start flex-wrap">
      <img src="${v.thumbnail}" class="w-28 h-18 object-cover rounded-lg border border-[#2a2a2a]" />
      <div class="flex-1 min-w-0">
        <p class="text-base font-semibold">${v.title} ${recent ? '🔥' : ''}</p>
        <p class="text-xs text-[var(--txt-dim)] font-mono">${v.artist} · ${fmtAge(v.publishedAt)}</p>
        <div class="mt-2 flex flex-wrap gap-1">
          <span class="badge ${v.category === 'grande' ? 'bg-red-900/40 text-red-300 border border-red-800' : v.category === 'petite' ? 'bg-blue-900/40 text-blue-300 border border-blue-800' : v.category === 'douteux' ? 'bg-amber-900/40 text-amber-300 border border-amber-800' : 'bg-gray-800 text-gray-400 border border-gray-700'}">${v.category === 'douteux' ? '⚠️ DOUTEUX' : v.category === 'hors-fenetre' ? 'NON CLASSÉ' : v.category}</span>
          ${v.frozen ? `<span class="badge bg-red-600 text-white"><i class="fa-solid fa-lock mr-1"></i>FIGÉ</span>` : ""}
          ${v.userValidated ? `<span class="badge bg-blue-600/30 text-blue-300 border border-blue-800"><i class="fa-solid fa-check mr-1"></i>VALIDÉ</span>` : ""}
          ${hasFocus ? `<span class="badge bg-amber-600/30 text-amber-300 border border-amber-800"><i class="fa-solid fa-bullseye mr-1"></i>FOCUS ${v.focusInterval || 30}min</span>` : ""}
        </div>
      </div>
      <div class="flex flex-col items-center shrink-0 relative">${scoreRing(v.score, 56)}<span class="absolute font-display text-sm" style="color:${scoreColor(v.score)}">${v.score}</span></div>
    </div>

    <div class="flex flex-wrap justify-center gap-4 mt-4 border-t border-[#2a2a2a] pt-4">
      <div class="text-center">
        <p class="text-xs text-[var(--txt-dim)]">Score</p>
        <p class="font-display text-lg" style="color:${scoreColor(v.score)}">${v.score}</p>
        ${v.needsValidation ? `<button class="text-[10px] text-amber-400 hover:text-white underline" onclick="openClassificationModal('${v.id}')">Classifier</button>` : ''}
      </div>
      <div class="text-center">
        <p class="text-xs text-[var(--txt-dim)]">Tendance</p>
        <p class="font-semibold text-sm ${v.breakout ? 'text-green-400' : v.slowdown ? 'text-red-400' : 'text-[var(--txt-dim)]'}">
          ${v.breakout ? '📈 Montée' : v.slowdown ? '📉 Ralentit' : '➡️ Stable'}
        </p>
      </div>
      <div class="text-center">
        <p class="text-xs text-[var(--txt-dim)]">Focus</p>
        <p class="font-semibold text-sm ${hasFocus ? 'text-amber-400' : 'text-[var(--txt-dim)]'}">
          ${hasFocus ? `🟡 ${v.focusInterval || 30}min` : '⚪ Off'}
        </p>
        <button class="text-[10px] text-[var(--txt-dim)] hover:text-white underline" onclick="openFocusSettings('${v.id}')">Configurer</button>
      </div>
    </div>

    <div class="flex flex-wrap justify-center gap-2 mt-4">
      <button onclick="openPlayer('${v.id}')" class="px-4 py-2 rounded-lg text-xs font-semibold transition bg-red-600 hover:bg-red-500 text-white"><i class="fa-solid fa-play mr-1"></i>Écouter</button>
      <button onclick="toggleFreeze('${v.id}')" class="px-4 py-2 rounded-lg text-xs font-semibold transition ${v.frozen ? 'bg-red-900/50 text-red-300 cursor-default' : 'bg-[#262626] text-[var(--txt-dim)] hover:text-white hover:bg-red-600'}">
        <i class="fa-solid ${v.frozen ? 'fa-lock' : 'fa-lock-open'} mr-1"></i>${v.frozen ? 'Figé' : 'Figer'}
      </button>
      <button onclick="deleteVideo('${v.id}')" class="px-4 py-2 rounded-lg text-xs font-semibold transition bg-red-900/30 text-red-300 hover:bg-red-600">Supprimer</button>
    </div>
  </div>

  <div class="card p-4 mb-4">
    <div class="flex justify-between items-center mb-2 flex-wrap gap-2">
      <p class="text-xs text-[var(--txt-dim)]">📈 Évolution Vues / Likes / Commentaires</p>
      <div class="flex gap-3 text-xs font-mono flex-wrap">
        <span>Vues <span class="${getVariationClass(viewsVariation)}">${formatVariation(viewsVariation)}</span></span>
        <span>Likes <span class="${getVariationClass(likesVariation)}">${formatVariation(likesVariation)}</span></span>
        <span>Comm. <span class="${getVariationClass(commentsVariation)}">${formatVariation(commentsVariation)}</span></span>
      </div>
    </div>
    <canvas id="main-chart" height="180"></canvas>
  </div>

  ${hasFocus && state.focusData ? `
  <div class="card p-4 mb-4 focus-curve">
    <p class="text-xs text-[var(--txt-dim)] mb-1">🎯 Focus — Rafraîchissement toutes les ${v.focusInterval || 30} min</p>
    <canvas id="focus-chart" height="160"></canvas>
  </div>` : ''}

  <div class="card p-4">
    <p class="text-xs text-[var(--txt-dim)] mb-2"><i class="fa-solid fa-comments mr-1"></i>Commentaires</p>
    ${renderComments(v)}
  </div>`;
}

function renderComments(v) {
  if (v.comments == null) {
    return `<div class="flex items-center justify-center py-4 text-[var(--txt-dim)] text-xs"><i class="fa-solid fa-spinner animate-spin mr-2"></i>Chargement des commentaires...</div>`;
  }
  if (v.comments.error) return `<p class="text-xs text-red-400">${v.comments.error}</p>`;
  if (!v.comments.items || !v.comments.items.length) return `<p class="text-xs text-[var(--txt-dim)]">Aucun commentaire disponible.</p>`;
  return v.comments.items.slice(0, 5).map(c => `
    <div class="flex items-start gap-2 py-2 border-b border-[var(--line)] last:border-0">
      <img src="${c.authorImg || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(c.author) + '&background=FF0000&color=fff&size=32'}" class="w-7 h-7 rounded-full shrink-0" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(c.author)}&background=FF0000&color=fff&size=32'" />
      <div class="flex-1 min-w-0">
        <p class="text-xs font-semibold">${c.author}</p>
        <p class="text-xs text-[var(--txt-dim)] mt-0.5">${(c.text||"").slice(0,200)}${(c.text||"").length > 200 ? '…' : ''}</p>
        <p class="text-[10px] text-[var(--txt-dim)] mt-0.5">❤️ ${c.likeCount || 0}</p>
      </div>
    </div>
  `).join("");
}

function renderAnalyseCharts() {
  const v = state.selectedVideoId ? state.trackedVideos[state.selectedVideoId] : null;
  if (!v || !v.fullSnapshots || v.fullSnapshots.length < 2) return;

  const ctx = document.getElementById("main-chart");
  if (ctx) {
    if (mainChartInstance) { mainChartInstance.destroy(); mainChartInstance = null; }
    const pubTime = new Date(v.publishedAt).getTime();
    const realCount = v.fullSnapshots.length;
    const labels = v.fullSnapshots.map(s => "J" + Math.max(1, Math.round((new Date(s.t).getTime() - pubTime) / 86400000) + 1));

    const horizonDays = getPredictionHorizonDays();
    const prediction = predictSeries(v.fullSnapshots, horizonDays, s => s.views);
    const predictedDataset = [];
    if (prediction) {
      for (let i = 0; i < realCount - 1; i++) predictedDataset.push(null);
      predictedDataset.push(v.fullSnapshots[realCount - 1].views);
      prediction.points.forEach((p) => {
        labels.push("J" + (Math.max(1, Math.round((new Date(p.t).getTime() - pubTime) / 86400000) + 1)) + " (préd.)");
        predictedDataset.push(Math.round(p.value));
      });
    }

    mainChartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: 'Vues', data: v.fullSnapshots.map(s => s.views), borderColor: COLORS.red, backgroundColor: 'rgba(255,0,0,0.08)', tension: 0.3, fill: true, yAxisID: 'y' },
          { label: 'Likes', data: v.fullSnapshots.map(s => s.likes), borderColor: COLORS.blue, backgroundColor: 'rgba(59,130,246,0.08)', tension: 0.3, fill: true, yAxisID: 'y1' },
          { label: 'Commentaires', data: v.fullSnapshots.map(s => s.commentCount || 0), borderColor: COLORS.amber, backgroundColor: 'rgba(255,176,32,0.08)', tension: 0.3, fill: true, yAxisID: 'y1' },
          ...(prediction ? [{ label: `Vues prédites (fiabilité ${Math.round(prediction.confidencePercent)}%)`, data: predictedDataset, borderColor: COLORS.red, backgroundColor: 'transparent', borderDash: [6, 4], tension: 0.3, fill: false, yAxisID: 'y', pointRadius: 2 }] : []),
        ]
      },
      options: {
        responsive: true,
        interaction: { mode: 'index', intersect: false },
        scales: {
          y: { position: 'left', ticks: { color: '#9A9A9A' }, grid: { color: '#222' } },
          y1: { position: 'right', ticks: { color: '#9A9A9A' }, grid: { display: false } },
          x: { ticks: { color: '#9A9A9A' }, grid: { display: false } }
        },
        plugins: { legend: { labels: { color: '#F2F2F2', font: { size: 10 } } } }
      }
    });
  }

  if (state.focusData && state.focusData.length >= 2) {
    const ctxFocus = document.getElementById("focus-chart");
    if (ctxFocus) {
      if (focusChartInstance) { focusChartInstance.destroy(); focusChartInstance = null; }
      const pubTime = new Date(v.publishedAt).getTime();
      const labels = state.focusData.map(s => "J" + Math.max(1, Math.round((new Date(s.t).getTime() - pubTime) / 86400000) + 1));
      focusChartInstance = new Chart(ctxFocus, {
        type: 'line',
        data: {
          labels,
          datasets: [
            { label: 'Focus Vues', data: state.focusData.map(s => s.views), borderColor: COLORS.red, backgroundColor: 'rgba(255,0,0,0.1)', tension: 0.3, fill: true, borderWidth: 3, pointRadius: 4, pointBackgroundColor: COLORS.red },
            { label: 'Focus Likes', data: state.focusData.map(s => s.likes), borderColor: COLORS.blue, backgroundColor: 'rgba(59,130,246,0.1)', tension: 0.3, fill: true, borderWidth: 3, pointRadius: 4, pointBackgroundColor: COLORS.blue },
            { label: 'Focus Commentaires', data: state.focusData.map(s => s.commentCount || 0), borderColor: COLORS.amber, backgroundColor: 'rgba(255,176,32,0.1)', tension: 0.3, fill: true, borderWidth: 3, pointRadius: 4, pointBackgroundColor: COLORS.amber },
          ]
        },
        options: {
          responsive: true,
          interaction: { mode: 'index', intersect: false },
          scales: {
            y: { position: 'left', ticks: { color: '#9A9A9A' }, grid: { color: '#222' } },
            x: { ticks: { color: '#9A9A9A' }, grid: { display: false } }
          },
          plugins: { legend: { labels: { color: '#F2F2F2', font: { size: 10 } } } }
        }
      });
    }
  }
}

// ========================================================================
// CHARTS
// ========================================================================
function renderCharts() {
  const mode = state.chartsMode || 'top20';
  const limit = mode === 'top20' ? 20 : 100;
  const header = `
  <div class="flex items-center justify-between mb-3">
    <div class="chip-tabs">
      <button class="chip-tab ${mode==='top20'?'active':''}" onclick="setChartsMode('top20')">Top 20</button>
      <button class="chip-tab ${mode==='top100'?'active':''}" onclick="setChartsMode('top100')">Top 100</button>
    </div>
    <button onclick="syncCharts()" class="w-7 h-7 rounded-full bg-[#1a1a1a] flex items-center justify-center text-[var(--txt-dim)]" ${state.loading?'disabled':''}>
      <i class="fa-solid fa-rotate ${state.loading?'animate-spin':''}"></i>
    </button>
  </div>`;

  if (!state.charts.length) {
    return header + `<div class="flex flex-col items-center justify-center py-16 text-[var(--txt-dim)]"><i class="fa-solid fa-ranking-star text-3xl mb-3 opacity-40"></i><p class="text-sm text-center">Charge les tendances YouTube Music FR.</p></div>`;
  }

  const filtered = state.quickFilter
    ? state.charts.filter(c => c.channelTitle.toLowerCase().includes(state.quickFilter.toLowerCase()))
    : state.charts;
  const list = filtered.slice(0, limit);
  const syncLabel = state.chartsLastSync ? `<p class="text-[10px] text-[var(--txt-dim)] font-mono mb-3">Dernière sync : ${state.chartsLastSync.toLocaleTimeString('fr-FR')}</p>` : '';

  return header + syncLabel + `<div class="card px-2">${list.map(c => chartRow(c)).join('')}</div>`;
}

function chartRow(c) {
  return `
  <div class="rank-row cursor-pointer" onclick="openAnalyse('${c.id}')">
    <span class="rank-num">${c.rank}</span>
    <img src="${c.thumbnail}" class="rank-avatar" alt="${c.channelTitle}"/>
    <div class="flex-1 min-w-0">
      <p class="rank-name truncate">${c.channelTitle}</p>
      <p class="rank-sub truncate">${c.title}</p>
    </div>
    <div class="flex flex-col items-end gap-0.5">
      <span class="rank-score">${c.score}</span>
      <span class="rank-delta ${deltaClass(c.rankDelta||0)}">${deltaLabel(c.rankDelta||0)}</span>
    </div>
  </div>`;
}

// ========================================================================
// PARAMÈTRES
// ========================================================================
function renderParametres() {
  const threshold = getRecentThresholdDays();
  const notif = getNotifSettings();
  const viewsUnit = getViewsUnit();
  return `
  <div>
    <p class="settings-section-title !mt-0">Compte</p>
    <div class="card px-1">
      <div class="settings-row">
        <div>
          <p class="settings-label">Mode local</p>
          <p class="settings-sub">100% privé</p>

    <p class="settings-section-title">Notifications</p>

      <div class="settings-row">

        <label class="toggle-switch"><input type="checkbox" ${notif.alertes?'checked':''} onchange="toggleNotifSetting('alertes')"/><span class="toggle-slider"></span></label>

      <div class="settings-row">
        <div><p class="settings-label">Nouveaux morceaux</p><p class="settings-sub">Être notifié des nouveaux morceaux suivis</p></div>
        <label class="toggle-switch"><input type="checkbox" ${notif.nouveaux?'checked':''} onchange="toggleNotifSetting('nouveaux')"/><span class="toggle-slider"></span></label>
      </div>

        <div><p class="settings-label">Résumé quotidien</p><p class="settings-sub">Recevoir un résumé chaque matin</p></div>
        <label class="toggle-switch"><input type="checkbox" ${notif.resume?'checked':''} onchange="toggleNotifSetting('resume')"/><span class="toggle-slider"></span></label>
      </div>

        <i class="fa-solid fa-chevron-right settings-chevron"></i>
      </div>
      <div class="settings-row" onclick="openThresholdModal()" style="cursor:pointer;">

        <i class="fa-solid fa-chevron-right settings-chevron"></i>
      </div>
      <div class="settings-row" onclick="cycleViewsUnit()" style="cursor:pointer;">

    <div class="card px-1">
      <div class="settings-row" onclick="syncAll()" style="cursor:pointer;">
        <div><p class="settings-label">Synchronisation manuelle</p><p class="settings-sub">Lancer maintenant</p></div>
        <i class="fa-solid fa-chevron-right settings-chevron"></i>
      </div>
      <div class="settings-row" onclick="openHistoryModal()" style="cursor:pointer;">

        <i class="fa-solid fa-chevron-right settings-chevron"></i>

// ========================================================================
// AUTHENTIFICATION
// ========================================================================
function renderLoginScreen() {
  return `<div class="min-h-screen flex items-center justify-center px-4">
    <div class="max-w-md w-full">
      <div class="flex items-center gap-2 mb-6 justify-center"><div class="w-10 h-10 rounded-lg bg-red-600 flex items-center justify-center"><i class="fa-brands fa-youtube text-white"></i></div><p class="font-display text-lg">RAP PULSE</p></div>
      <div class="card p-6">
        <p class="text-sm font-semibold mb-1">Connexion</p>
        <p class="text-xs text-[var(--txt-dim)] mb-4">Accès réservé</p>
        <input id="login-email" type="email" placeholder="email@exemple.com" class="text-sm mb-2" />
        <input id="login-password" type="password" placeholder="Mot de passe" class="text-sm mb-3" />
        <button id="login-submit" class="w-full py-2.5 rounded-lg bg-red-600 hover:bg-red-500 text-white text-sm font-semibold transition">Se connecter</button>
        <p id="login-error" class="text-xs text-red-400 mt-2 hidden"></p>
      </div>
    </div>
  </div>`;
}

function bindLoginScreen() {
  const submit = document.getElementById("login-submit");
  const doLogin = async () => {
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;
    const errEl = document.getElementById("login-error");
    errEl.classList.add("hidden");
    try {
      await auth.signInWithEmailAndPassword(email, password);
    } catch(e) {
      errEl.textContent = "Connexion refusée : " + e.message;
      errEl.classList.remove("hidden");
    }
  };
  submit.onclick = doLogin;
  document.getElementById("login-password").addEventListener("keydown", e => { if(e.key === 'Enter') doLogin(); });
}

// ========================================================================
// BOOT
// ========================================================================
state.authLoading = true;
auth.onAuthStateChanged(user => {
  state.authLoading = false;
  state.user = user;
  if (user) {
    fsListenArtists();
    fsListenVideos();
  } else {
    if (unsubscribeVideos) unsubscribeVideos();
    if (unsubscribeArtists) unsubscribeArtists();
    unsubscribeVideos = null;
    unsubscribeArtists = null;
    state.trackedVideos = {};
    state.artists = [];
    state.currentVideoId = null;
    state.selectedArtist = null;
    if (syncInterval) { clearInterval(syncInterval); syncInterval = null; }
  }
  render();
});
render();
</script>
